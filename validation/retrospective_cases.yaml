version: 0.5.0
preregistered_at: "2026-08-29"
notes:
  - "Milestone dates are ecosystem/adoption proxies selected before collecting historical curves; they are not claims that the technology became universally obvious on that exact day."
  - "Validation must preserve raw monthly provider counts and sampled actor evidence. Do not change case dates after seeing score curves without creating a new validation version."
  - "v0.2 added conservative sample-based semantic gating after v0.1 showed that aggregate keyword counts manufacture pre-origin history."
  - "v0.3 strengthened alias/context disambiguation and excluded current GitHub repository metadata from historical scoring because mutable name/description can leak future terminology backward to repository created_at."
  - "v0.4 preserves the original broad discovery queries and all preregistered dates, but adds a mechanically targeted historical query for each already-discovered semantic cluster. This mirrors production targeted backfill: discovery is broad; history is cluster-conditioned."
  - "v0.5 keeps every original origin/milestone date and adds preregistered GitHub repositories for B-032. GitHub implementation time is eligible only from a relevant commit/release/tag timestamp; repository created_at and current description remain ineligible."

cases:
  - id: rag
    label: "Retrieval-Augmented Generation (RAG)"
    profile: software_ai
    technology_direction: "retrieval-augmented generation"
    openalex_query: "retrieval augmented generation"
    github_query: '"retrieval augmented generation"'
    validation_start: "2019-01-01"
    semantic_filter:
      anchor: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
      historical_query: '"retrieval augmented generation"'
      aliases:
        - "retrieval augmented generation"
        - "rag"
      context_terms:
        - "knowledge"
        - "language model"
        - "nlp"
        - "retrieval"
    implementation_validation:
      repositories:
        - repository: "huggingface/transformers"
          distinctive_terms:
            - "RagRetriever"
        - repository: "openai/chatgpt-retrieval-plugin"
          distinctive_terms:
            - "ChatGPT Retrieval Plugin"
    origin:
      date: "2020-05-22"
      kind: research
      title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
      url: "https://arxiv.org/abs/2005.11401"
    milestone:
      date: "2023-03-23"
      kind: implementation_ecosystem_proxy
      title: "openai/chatgpt-retrieval-plugin repository creation"
      url: "https://github.com/openai/chatgpt-retrieval-plugin"
    preregistered_expectation:
      useful_signal_score: 60
      useful_signal_confidence: 0.45
      target_lead_months: 3
      note: "A useful detector should cross the provisional emerging threshold before the ecosystem milestone, ideally by at least 3 months."

  - id: lora
    label: "Low-Rank Adaptation (LoRA)"
    profile: software_ai
    technology_direction: "low-rank adaptation of large language models"
    openalex_query: "low rank adaptation large language models"
    github_query: "lora llm"
    validation_start: "2020-01-01"
    semantic_filter:
      anchor: "LoRA Low-Rank Adaptation of Large Language Models"
      historical_query: '"low rank adaptation" AND ("language model" OR "language models" OR LLM OR transformer)'
      aliases:
        - "low rank adaptation"
        - "lora"
      context_terms:
        - "llm"
        - "language model"
        - "fine tuning"
        - "parameter efficient"
        - "transformer"
        - "adapter"
    implementation_validation:
      repositories:
        - repository: "microsoft/LoRA"
          distinctive_terms:
            - "LoRA"
        - repository: "huggingface/peft"
          distinctive_terms:
            - "LoRA"
    origin:
      date: "2021-06-17"
      kind: research
      title: "LoRA: Low-Rank Adaptation of Large Language Models"
      url: "https://arxiv.org/abs/2106.09685"
    milestone:
      date: "2022-11-25"
      kind: implementation_ecosystem_proxy
      title: "huggingface/peft repository creation"
      url: "https://github.com/huggingface/peft"
    preregistered_expectation:
      useful_signal_score: 60
      useful_signal_confidence: 0.45
      target_lead_months: 3
      note: "A useful detector should cross the provisional emerging threshold before the PEFT ecosystem milestone, ideally by at least 3 months."
