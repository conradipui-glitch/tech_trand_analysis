version: 0.2.0
preregistered_at: "2026-08-29"
notes:
  - "Milestone dates are ecosystem/adoption proxies selected before collecting historical curves; they are not claims that the technology became universally obvious on that exact day."
  - "Validation must preserve raw monthly provider counts and sampled actor evidence. Do not change case dates after seeing score curves without creating a new validation version."
  - "v0.2 keeps every original origin/milestone date and query, but adds a conservative sample-based semantic gate after v0.1 demonstrated that provider aggregate keyword counts manufacture pre-origin history."
  - "OpenAlex/GitHub raw aggregate counts remain audit data. Only cluster-conditioned estimated counts are mapped into TrendState for scoring."

cases:
  - id: rag
    label: "Retrieval-Augmented Generation (RAG)"
    profile: software_ai
    technology_direction: "retrieval-augmented generation"
    openalex_query: "retrieval augmented generation"
    github_query: '"retrieval augmented generation"'
    validation_start: "2019-01-01"
    semantic_filter:
      anchor: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
      aliases:
        - "retrieval augmented generation"
        - "rag"
      context_terms:
        - "knowledge"
        - "language model"
        - "nlp"
        - "retrieval"
    origin:
      date: "2020-05-22"
      kind: research
      title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
      url: "https://arxiv.org/abs/2005.11401"
    milestone:
      date: "2023-03-23"
      kind: implementation_ecosystem_proxy
      title: "openai/chatgpt-retrieval-plugin repository creation"
      url: "https://github.com/openai/chatgpt-retrieval-plugin"
    preregistered_expectation:
      useful_signal_score: 60
      useful_signal_confidence: 0.45
      target_lead_months: 3
      note: "A useful detector should cross the provisional emerging threshold before the ecosystem milestone, ideally by at least 3 months."

