name: routing-research-only

on:
  push:
    paths:
      - '.github/workflows/routing-research-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -e .
      - name: Validate real OpenAlex science-only sample and source readiness
        run: python scripts/validate_routing_research_only.py
      - name: Preserve raw bounded provider findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-research-only
          path: validation/results/b031_b033_live.json
          if-no-files-found: warn
          retention-days: 21
