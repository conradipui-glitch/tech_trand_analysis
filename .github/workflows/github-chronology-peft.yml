name: github-chronology-peft

on:
  push:
    paths:
      - '.github/workflows/github-chronology-peft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU BGE-M3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[embeddings]'
      - name: Verify bounded PEFT implementation chronology
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/run_github_chronology_pilot.py
      - name: Preserve chronological candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-chronology-peft
          path: validation/results/github-chronology-peft.json
          if-no-files-found: warn
          retention-days: 21
