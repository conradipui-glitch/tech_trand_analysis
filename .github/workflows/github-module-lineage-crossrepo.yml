name: github-module-lineage-crossrepo

on:
  push:
    paths:
      - '.github/workflows/github-module-lineage-crossrepo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossrepo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic validation dependencies
        run: python -m pip install -e .
      - name: Validate frozen cross-repo real Git evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/evaluate_github_module_lineage_crossrepo.py
      - name: Upload complete decisions and source references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-module-lineage-crossrepo
          path: validation/results/github_module_lineage_crossrepo_v2.json
          if-no-files-found: warn
          retention-days: 21
