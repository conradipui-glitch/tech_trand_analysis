name: github-patch-external-v2

on:
  push:
    paths:
      - '.github/workflows/github-patch-external-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU embedding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[embeddings]'
      - name: Score frozen Git SHAs with immutable source patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/evaluate_github_patch_external.py
      - name: Upload full evaluation and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-patch-external-v2
          path: validation/results/github_patch_external_v2.json
          if-no-files-found: warn
          retention-days: 21
