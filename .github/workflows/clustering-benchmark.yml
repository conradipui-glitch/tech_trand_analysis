name: clustering-benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/clustering-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "sentence-transformers>=5.0,<6" "transformers>=4.51,<5" "scikit-learn>=1.5,<2"

      - name: Run clustering sweep
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/run_clustering_benchmark.py \
            --model "BAAI/bge-m3" \
            --output "benchmark-results/clustering-bge-m3.json" \
            --batch-size 16

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clustering-benchmark-bge-m3
          path: benchmark-results/clustering-bge-m3.json
          if-no-files-found: error
          retention-days: 30
