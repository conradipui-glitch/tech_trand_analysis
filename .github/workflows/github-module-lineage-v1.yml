name: github-module-lineage-v1

on:
  push:
    paths:
      - '.github/workflows/github-module-lineage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU BGE-M3
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[embeddings]'
      - name: Run frozen Git module ancestry sample
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/evaluate_github_module_lineage.py
      - name: Preserve source ancestry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-module-lineage-v1
          path: validation/results/github_module_lineage_v1.json
          if-no-files-found: warn
          retention-days: 14
