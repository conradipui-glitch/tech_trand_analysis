name: github-external-holdout

on:
  push:
    paths:
      - '.github/workflows/github-external-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU BGE-M3 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[embeddings]'
      - name: Evaluate frozen external Git event holdout
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/evaluate_github_external.py
      - name: Preserve external holdout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-external-holdout
          path: validation/results/github_external_bge_v1.json
          if-no-files-found: warn
          retention-days: 21
