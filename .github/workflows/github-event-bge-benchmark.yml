name: github-event-bge-benchmark

on:
  push:
    paths:
      - '.github/workflows/github-event-bge-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU BGE-M3 benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[embeddings]'
      - name: Evaluate raw versus local Git evidence semantics
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/evaluate_github_event_embeddings.py
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-event-bge-benchmark
          path: validation/results/github_event_bge_m3_v0.json
          if-no-files-found: warn
          retention-days: 21
